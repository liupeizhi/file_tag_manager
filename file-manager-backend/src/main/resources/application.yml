spring:
  application:
    name: file-manager-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:18887/file_manager?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 1001
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        name: FILE_MANAGER_SESSION

app:
  encryption:
    key: ${APP_ENCRYPTION_KEY:filemanager12345}
  scripts:
    path: ${APP_SCRIPTS_PATH:/Users/liupeizhi/code_lab/file_manager/scripts}
  webdav:
    # 自签名证书白名单(SHA-256 指纹)。证书链仍按 JDK 信任库校验,
    # 仅这些指纹在主机名校验失败时被放行。多个用逗号分隔。
    pinned-certificates: ${WEBDAV_PINNED_CERTIFICATES:A3:6F:0A:D3:E7:6D:07:AA:B9:E0:DA:9F:EE:C3:05:D8:4A:8C:14:22:7C:20:A7:E4:F5:4F:01:B4:AA:F9:A4:72}
  theme:
    # 用户自定义背景图的存放目录
    background-path: ${APP_THEME_BACKGROUND_PATH:${user.home}/.file-manager/backgrounds}
  video:
    # 浏览器无法原生解码的容器(AVI/RMVB/WMV/FLV/MOV 等)需要服务端转码为 MP4
    ffmpeg-path: ${APP_VIDEO_FFMPEG_PATH:ffmpeg}
    cache-path: ${APP_VIDEO_CACHE_PATH:${user.home}/.file-manager/video-cache}
    max-convert-seconds: ${APP_VIDEO_MAX_CONVERT_SECONDS:300}
    max-size-bytes: ${APP_VIDEO_MAX_SIZE_BYTES:2147483648}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5183}
  file:
    max-recursion-depth: 20
    path:
      max-length: 4096
      max-depth: 50
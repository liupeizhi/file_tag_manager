# 本机 WebDAV 分享配置(模板)
#
# 由 start.sh 复制并替换 __SHARE_DIR__ 后使用, 请勿直接运行本文件。
# 也可以自行复制一份改名为 wsgidav.local.yaml 后自行维护。

# 只监听 127.0.0.1, 仅本机可访问。
# 若要让局域网其他设备访问, 改成 0.0.0.0 并确认 macOS 防火墙放行,
# 同时务必改掉下面的默认口令。
host: 127.0.0.1
port: 8181

# 访问日志级别: 1=只记请求行, 0=关闭
verbose: 1

# 共享目录映射(可加多条)
provider_mapping:
  "/": "__SHARE_DIR__"

# 用户口令认证
http_authenticator:
  # null 表示使用下面的 simple_dc 用户表
  domain_controller: null
  accept_basic: true
  accept_digest: false
  default_to_digest: false

simple_dc:
  user_mapping:
    "*":
      admin:
        password: "admin"
        roles:
          - admin

# 浏览器访问 http://127.0.0.1:8181/ 时显示目录列表
dir_browser:
  enable: true
